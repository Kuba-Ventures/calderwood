<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand Guidelines</title>
<!--
  ─────────────────────────────────────────────────────────────────
  DO NOT EDIT THIS FILE PER CLIENT.
  This is the shared template. Client data lives in brand.json.
  Build with:  python3 render.py <client-dir>
  ─────────────────────────────────────────────────────────────────
-->
<style>
:root{
  --paper:#FBFBF9; --ink:#17191B; --ink-soft:#5E6469; --ink-faint:#9AA0A4;
  --rule:#DEE0DC; --rule-strong:#17191B; --slot:#C6CAC5; --slot-fill:#F3F3F0;
  --brand-1:#8A9299; --brand-2:#B4BABE; --brand-3:#D7DAD9;
  --ok:#3E7A52; --no:#A33A2E;
  --sans: ui-sans-serif, -apple-system, "Helvetica Neue", Carlito, "DejaVu Sans", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#E8E8E4}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ── page shell ─────────────────────────────────────────── */
.page{position:relative;width:11in;height:8.5in;background:var(--paper);
  padding:.42in;margin:0 auto .35in;overflow:hidden}
.frame{position:absolute;inset:.42in;border:1px solid var(--rule-strong);pointer-events:none}
.inner{position:relative;height:100%;padding:.4in .48in .6in;display:flex;flex-direction:column}
.rh{display:flex;justify-content:space-between;align-items:baseline;
  font:400 6.5pt/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.rf{position:absolute;left:.48in;right:.48in;bottom:.3in;display:flex;
  justify-content:space-between;align-items:baseline;font:400 6.5pt/1 var(--mono);
  letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint)}
.rf .folio{color:var(--ink);letter-spacing:.2em}

/* ── type ───────────────────────────────────────────────── */
.head{margin-top:.26in}
.eyebrow{font:400 7pt/1 var(--mono);letter-spacing:.34em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:.14in}
h2.pagetitle{font:500 13pt/1.1 var(--mono);letter-spacing:.02em;text-transform:uppercase}
.lede{font:400 8.5pt/1.55 var(--sans);color:var(--ink-soft);max-width:5.6in;margin-top:.1in}
.rule{height:1px;background:var(--rule-strong);margin:.2in 0}
.seclabel{font:400 6.5pt/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;
  color:var(--ink);padding-bottom:.06in;border-bottom:1px solid var(--rule-strong);margin-bottom:.16in}
.caption{font:400 7pt/1.45 var(--sans);color:var(--ink-soft)}
.caption b{color:var(--ink);font-weight:600}
.tag{font:400 6.5pt/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint)}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:.5in;margin-top:.2in}
.dodont h4{font:400 6.5pt/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:.07in}
.dodont .do h4{color:var(--ok)} .dodont .dont h4{color:var(--no)}
.derived{display:inline-block;margin-left:.06in;padding:.02in .06in;border:1px solid var(--ink-faint);
  font:400 5pt/1.3 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);
  vertical-align:.02in}

/* ── logo slots ─────────────────────────────────────────── */
.slot{position:relative;display:flex;align-items:center;justify-content:center;
  background:var(--slot-fill);overflow:hidden}
.slot img{max-width:78%;max-height:72%;display:block}
.slot.is-empty img{display:none}
.slot.is-empty{border:1px dashed var(--slot);
  background:repeating-linear-gradient(45deg,#F6F6F3 0 6px,#EFEFEB 6px 12px)}
.slot .ph{display:none;text-align:center;padding:.1in}
.slot.is-empty .ph{display:block}
.slot .ph em{display:block;font:400 6.5pt/1.5 var(--mono);color:#8D9490;
  letter-spacing:.06em;font-style:normal;word-break:break-all}
.slot .ph strong{display:block;font:400 6pt/1 var(--mono);letter-spacing:.22em;
  text-transform:uppercase;color:#A9AFAA;margin-bottom:.05in}
.slot.on-ink{background:var(--ink)}
.slot.on-ink.is-empty{background:repeating-linear-gradient(45deg,#1D1F21 0 6px,#26282A 6px 12px);
  border-color:#3A3D3F}
.slot.on-ink .ph em{color:#8A9095} .slot.on-ink .ph strong{color:#63696D}
.slot.on-brand{background:var(--brand-1)}
.slot.on-brand.is-empty{background:var(--brand-1);border-color:rgba(255,255,255,.5)}
.slot.on-brand .ph em{color:rgba(255,255,255,.72)}
.slot.on-brand .ph strong{color:rgba(255,255,255,.55)}
.mono-b img{filter:brightness(0)}
.mono-w img{filter:brightness(0) invert(1)}

/* ── cover ──────────────────────────────────────────────── */
.p-cover .cbody{flex:1;display:grid;grid-template-columns:1.15fr .85fr;gap:.6in;align-items:center}
.cname{font:500 34pt/1.04 var(--mono);letter-spacing:-.02em;text-transform:uppercase}
.cdesc{font:400 8pt/1 var(--mono);letter-spacing:.32em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:.22in}
.clogo{height:2.4in;border:1px solid var(--rule)}
.cchips{display:flex;margin-top:.34in;border:1px solid var(--rule-strong)}
.cchip{flex:1;height:.62in;display:flex;align-items:flex-end;padding:.06in .08in;
  font:400 6pt/1 var(--mono);letter-spacing:.08em}
.cmeta{display:flex;gap:.14in;margin-top:.3in;flex-wrap:wrap}
.cmeta span{border:1px solid var(--ink);padding:.05in .12in;
  font:400 6.5pt/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}

/* ── foundation ─────────────────────────────────────────── */
.fhead{font:400 30pt/1.12 var(--sans);letter-spacing:-.025em;max-width:7.6in}
.fhead .b{color:var(--brand-1)}
.fbody{font:400 9.5pt/1.8 var(--sans);color:var(--ink-soft);max-width:6.2in;margin-top:.26in}
.fbody b{color:var(--ink);font-weight:600}
.pillars{display:grid;gap:.4in;margin-top:auto;padding-top:.3in}
.pillar{border-top:1px solid var(--rule-strong);padding-top:.11in}
.pillar .n{font:400 6pt/1 var(--mono);letter-spacing:.2em;color:var(--ink-faint)}
.pillar h5{font:400 8.5pt/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;margin:.09in 0 .09in}
.pillar p{font:400 7pt/1.5 var(--sans);color:var(--ink-soft)}

/* ── primary logo ───────────────────────────────────────── */
.hero-slot{height:2.75in;margin:.16in 0 .1in;border:1px solid var(--rule)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5in;margin-top:.1in}
.cs-box{position:relative;height:1.5in;border:1px dashed var(--slot);padding:.22in;background:#FCFCFA}
.cs-x{position:absolute;top:.06in;left:.06in;width:.14in;height:.14in;border:1px solid var(--brand-1)}
.cs-xlabel{position:absolute;top:.05in;left:.26in;font:400 6pt/1.4 var(--mono);
  letter-spacing:.1em;color:var(--ink-faint)}
.min-row{display:flex;align-items:center;gap:.2in;height:1.5in}
.min-slot{width:1.7in;height:100%;border:1px solid var(--rule)}
.min-bar{flex:1}
.min-bar .bar{height:1px;background:var(--ink);position:relative;margin-bottom:.07in}
.min-bar .bar::before,.min-bar .bar::after{content:"";position:absolute;top:-.045in;
  width:1px;height:.09in;background:var(--ink)}
.min-bar .bar::before{left:0} .min-bar .bar::after{right:0}

/* ── variations / misuse grids ──────────────────────────── */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:.3in .28in;flex:1;margin-top:.1in}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.26in .24in;flex:1;margin-top:.1in}
.cell{display:flex;flex-direction:column;min-height:0}
.cell .clabel{font:400 6pt/1.35 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);padding-bottom:.05in;border-bottom:1px solid var(--rule-strong);margin-bottom:.08in}
.cell .slot{flex:1;border:1px solid var(--rule)}
.cell .slot.on-ink{border-color:var(--ink)}
.cell .ccap{font:400 6.5pt/1.4 var(--sans);color:var(--ink-soft);margin-top:.07in}
.cell .ccap b{color:var(--ink);font-weight:600}
.mis .slot{position:relative;background:var(--slot-fill)}
.mis .slot::after{content:"\00d7";position:absolute;top:.03in;right:.06in;
  font:400 9pt/1 var(--sans);color:var(--no)}
.mis-recolor img{filter:hue-rotate(150deg) saturate(2.4)}
.mis-effect img{filter:drop-shadow(3px 3px 2px rgba(0,0,0,.5))}
.mis-rotate img{transform:rotate(-9deg)}
.mis-stretch img{transform:scaleX(1.5);max-width:96%}
.mis-crowd img{max-width:96%;max-height:92%}
.mis-crowd .slot{border:3px solid var(--ink)!important}
.mis-busy .slot{background:linear-gradient(125deg,#4A3A2C,#7A2F2A 45%,#2C3B4A)}
.mis-lowcon .slot{background:var(--brand-1)}
.mis-lowcon img{opacity:.35}
.mis-retype .fake{font:700 12pt/1.15 var(--sans);text-align:center;letter-spacing:.01em}

/* ── color ──────────────────────────────────────────────── */
.swgrid{display:grid;gap:.28in;margin-top:.06in}
.sw{border:1px solid var(--rule)}
.sw .chip{height:1.85in}
.sw .meta{padding:.13in .14in .16in}
.sw .nm{font:500 10pt/1 var(--mono);letter-spacing:.04em;text-transform:uppercase}
.sw .hex{font:400 8.5pt/1 var(--mono);letter-spacing:.1em;margin-top:.07in}
.sw .rgb{font:400 6.5pt/1 var(--mono);letter-spacing:.1em;color:var(--ink-faint);margin-top:.05in}
.sw .use{font:400 7pt/1.45 var(--sans);color:var(--ink-soft);margin-top:.1in}
.nsws{display:grid;gap:.28in;margin-top:.18in}
.nsw{display:flex;border:1px solid var(--rule);height:.72in}
.nsw .chip{width:1.1in;flex:none}
.nsw .meta{padding:.1in .14in;display:flex;flex-direction:column;justify-content:center}
.nsw .nm{font:500 8pt/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
.nsw .hex{font:400 7pt/1 var(--mono);letter-spacing:.1em;color:var(--ink-soft);margin-top:.05in}

/* ── typography ─────────────────────────────────────────── */
.faces{display:grid;gap:.3in;margin-top:.06in}
.face{display:grid;grid-template-columns:1.5in 1fr;gap:.3in;
  border-top:1px solid var(--rule-strong);padding-top:.13in}
.face .fname{font:500 11pt/1.1 var(--sans)}
.face .frole{font:400 6pt/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:.06in}
.face .fsample{font:400 17pt/1.15 var(--sans);letter-spacing:-.01em}
.face .fnote{font:400 7pt/1.5 var(--sans);color:var(--ink-soft);margin-top:.08in}
.scale{width:100%;border-collapse:collapse;margin-top:.2in}
.scale td{border-bottom:1px solid var(--rule);padding:.09in .06in;vertical-align:baseline}
.scale .k{width:1.1in;font:400 6pt/1 var(--mono);letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-faint)}
.scale .spec{width:2.1in;text-align:right;font:400 6.5pt/1 var(--mono);
  letter-spacing:.08em;color:var(--ink-soft)}

/* ── iconography ────────────────────────────────────────── */
.icons{display:grid;gap:.34in .5in;align-content:start;margin-top:.1in}
.icons.few{flex:1;align-content:stretch;gap:.3in}
.icons.few .icon{grid-template-columns:2.6in 1fr;gap:.34in}
.icons.few .icon .slot{height:100%}
.icons.few .icon h5{font-size:14pt}
.icon{display:grid;grid-template-columns:1.35in 1fr;gap:.22in;align-items:start;
  border-top:1px solid var(--rule-strong);padding-top:.13in}
.icon .slot{border:1px solid var(--rule);height:1.35in}
.icon h5{font:400 12pt/1 var(--sans)}
.icon .irole{font:400 6pt/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:.06in}
.icon p{font:400 7pt/1.45 var(--sans);color:var(--ink-soft);margin-top:.08in}
.icon .rules{display:flex;gap:.24in;margin-top:.1in}
.icon .rules div{flex:1}
.icon .rules .k{font:400 5.5pt/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.icon .rules .do .k{color:var(--ok)} .icon .rules .dont .k{color:var(--no)}
.icon .rules p{font:400 6pt/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;margin-top:.04in}

/* ── art direction ──────────────────────────────────────── */
.ad{display:grid;grid-template-columns:1fr 1.15fr;gap:.4in;margin-top:.06in}
.adref{height:2.5in;border:1px solid var(--rule)}
.adlist > div{border-top:1px solid var(--rule);padding:.11in 0}
.adlist > div:first-child{border-top:0;padding-top:0}
.adlist h5{font:400 8pt/1 var(--mono);letter-spacing:.18em;text-transform:uppercase}
.adlist p{font:400 7pt/1.5 var(--sans);color:var(--ink-soft);margin-top:.06in}
.grounds{display:grid;grid-template-columns:repeat(3,1fr);gap:.28in;margin-top:.2in}
.ground .sw-g{height:1.05in;border:1px solid var(--rule);display:flex;align-items:flex-end;padding:.08in}
.ground .sw-g span{font:400 5.5pt/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.ground p{font:400 6.5pt/1.4 var(--sans);color:var(--ink-soft);margin-top:.08in}

/* ── voice ──────────────────────────────────────────────── */
.vattrs{display:grid;grid-template-columns:repeat(4,1fr);gap:.3in;margin-top:.06in}
.vattr{border-top:1px solid var(--rule-strong);padding-top:.11in}
.vattr h5{font:400 8pt/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.vattr p{font:400 7pt/1.5 var(--sans);color:var(--ink-soft);margin-top:.08in}
.reframe{margin-top:.24in}
.reframe .row{display:flex;align-items:baseline;gap:.14in;padding:.08in 0;
  border-bottom:1px solid var(--rule);font:400 8.5pt/1.4 var(--sans)}
.reframe .from{color:var(--ink-faint);text-decoration:line-through}
.reframe .arrow{font:400 7pt/1 var(--mono);color:var(--ink-faint)}
.reframe .to{color:var(--ink)}
.lex{display:grid;grid-template-columns:1fr 1fr;gap:.5in;margin-top:.22in}
.lex h4{font:400 6.5pt/1 var(--mono);letter-spacing:.24em;text-transform:uppercase;margin-bottom:.1in}
.lex .say h4{color:var(--ok)} .lex .avoid h4{color:var(--no)}
.lex ul{list-style:none;display:flex;flex-wrap:wrap;gap:.07in}
.lex li{font:400 7pt/1 var(--sans);border:1px solid var(--rule);padding:.05in .09in}
.lex .avoid li{color:var(--ink-faint)}

/* ── legal ──────────────────────────────────────────────── */
.legalbox{border:1px solid var(--ink);padding:.16in;margin-top:.06in}
.legalbox .k{font:400 6pt/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;
  color:var(--no);margin-bottom:.1in}
.legalbox p{font:400 7.5pt/1.6 var(--sans)}
.legalbox .note{font:400 6pt/1.4 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:.1in}
.ltable{width:100%;border-collapse:collapse;margin-top:.2in}
.ltable td{border-bottom:1px solid var(--rule);padding:.07in .06in;
  font:400 7pt/1.35 var(--sans)}
.ltable td:first-child{width:1.9in;font:400 6pt/1.35 var(--mono);letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-faint)}
.lnotes{display:grid;grid-template-columns:1fr 1fr;gap:.5in;margin-top:.2in}
.lnotes h5{font:400 6.5pt/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;margin-bottom:.08in}
.lnotes p{font:400 7pt/1.5 var(--sans);color:var(--ink-soft);margin-bottom:.08in}
.lnotes p b{color:var(--ink);font-weight:600}

/* ── applications ───────────────────────────────────────── */
.appgrid{display:grid;grid-template-columns:1.28fr 1fr;gap:.42in;flex:1;margin-top:.06in}
.app{display:flex;flex-direction:column;min-height:0}
.browser,.report{border:1px solid var(--ink);background:#fff;flex:1;
  display:flex;flex-direction:column;overflow:hidden}
.bchrome{display:flex;align-items:center;gap:.07in;padding:.08in .1in;
  background:#EFEFEC;border-bottom:1px solid var(--rule)}
.bdot{width:.055in;height:.055in;border-radius:50%;background:#C9CBC6}
.burl{flex:1;margin-left:.08in;background:#fff;border:1px solid var(--rule);border-radius:2px;
  padding:.035in .08in;font:400 5.5pt/1.2 var(--mono);color:var(--ink-faint)}
.bnav{display:flex;align-items:center;gap:.16in;padding:.1in .14in;border-bottom:1px solid var(--rule)}
.navlogo{width:.95in;height:.26in;background:none}
.navlogo.is-empty{border:1px dashed var(--slot)}
.navlogo .ph strong{display:none} .navlogo .ph em{font-size:4.6pt;line-height:1.1}
.bnav ul{list-style:none;display:flex;gap:.13in;margin-left:auto}
.bnav li{font:400 5.6pt/1 var(--sans);color:var(--ink-soft)}
.bnav .cta{background:var(--brand-1);color:#fff;padding:.045in .1in;border-radius:2px;
  font:600 5.6pt/1 var(--sans)}
.bhero{padding:.2in .14in;flex:1;display:flex;flex-direction:column;justify-content:center}
.bhero h3{font:500 11pt/1.15 var(--sans);letter-spacing:-.01em;max-width:2.9in}
.bhero h3 em{font-style:normal;color:var(--brand-1)}
.bhero p{font:400 6pt/1.5 var(--sans);color:var(--ink-soft);max-width:2.7in;margin-top:.08in}
.bhero .btns{display:flex;gap:.08in;margin-top:.14in}
.bhero .btns span{font:600 5.6pt/1 var(--sans);padding:.06in .12in;border-radius:2px}
.bhero .btns .b1{background:var(--brand-1);color:#fff}
.bhero .btns .b2{border:1px solid var(--rule);color:var(--ink)}
.bfeat{display:flex;border-top:1px solid var(--rule)}
.bfeat div{flex:1;padding:.11in .12in;font:400 5.4pt/1.45 var(--sans);color:var(--ink-soft)}
.bfeat div + div{border-left:1px solid var(--rule)}
.bfeat .fn{display:block;font:400 4.6pt/1 var(--mono);letter-spacing:.2em;
  color:var(--brand-1);margin-bottom:.04in}
.bstrip{display:flex;border-top:1px solid var(--rule)}
.bstrip div{flex:1;height:.3in;background:var(--brand-3)}
.bstrip div:nth-child(2){background:var(--brand-2)}
.bstrip div:nth-child(3){background:var(--brand-1)}
.rhead{padding:.13in .15in;border-bottom:2px solid var(--brand-1);display:flex;
  align-items:center;justify-content:space-between}
.rlogo{width:.9in;height:.24in;background:none}
.rlogo.is-empty{border:1px dashed var(--slot)}
.rlogo .ph strong{display:none} .rlogo .ph em{font-size:4.6pt;line-height:1.1}
.rmeta{font:400 5.2pt/1.35 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);text-align:right}
.rbody{padding:.16in .15in;flex:1}
.rtitle{font:500 10pt/1.15 var(--sans);letter-spacing:-.01em}
.rsub{font:400 5.6pt/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-faint);margin-top:.06in}
.rstats{display:flex;gap:.1in;margin-top:.14in}
.rstats div{flex:1;border-left:2px solid var(--brand-3);padding:.02in .09in}
.rstats .k{font:400 4.8pt/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.rstats .v{font:600 9pt/1 var(--sans);margin-top:.05in;color:var(--brand-1)}
.rbars{margin-top:.14in;display:flex;flex-direction:column;gap:.055in}
.rbars .row{display:flex;align-items:center;gap:.07in}
.rbars .lbl{width:.42in;font:400 4.8pt/1 var(--mono);letter-spacing:.08em;color:var(--ink-soft)}
.rbars .track{flex:1;height:.075in;background:var(--brand-3);position:relative}
.rbars .fill{position:absolute;inset:0 auto 0 0;background:var(--brand-1)}
.rtable{width:100%;border-collapse:collapse;margin-top:.14in}
.rtable td{border-bottom:1px solid var(--rule);padding:.055in .04in;
  font:400 5.2pt/1 var(--mono);letter-spacing:.06em;color:var(--ink-soft)}
.rtable td:first-child{color:var(--ink)}
.rtable td:last-child{text-align:right;color:var(--brand-1);font-weight:600}
.rfoot{padding:.09in .15in;border-top:1px solid var(--rule);display:flex;
  justify-content:space-between;font:400 5pt/1 var(--mono);letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-faint)}

@page{size:11in 8.5in;margin:0}
@media print{
  html{background:#fff}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
}
@media screen{
  .page{box-shadow:0 1px 3px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.06)}
  body{padding:.35in 0}
}
</style>
</head>
<body>
<main id="doc"></main>

<script>
/* render.py replaces the token below with the client's brand.json */
window.BRAND = /*__BRAND_JSON__*/ {"name":"Brand Name","descriptor":"Brand Guidelines","version":"v1.0","year":"2026","owner":"Company LLC","domain":"yourdomain.com","logos":{},"colors":{"primary":{"hex":"#8A9299","name":"Primary","use":"Logo, headlines, primary actions."}},"neutrals":{"ink":{"hex":"#17191B","name":"Ink","use":"Body text, dark surfaces."},"paper":{"hex":"#FFFFFF","name":"Paper","use":"Default background."}}};
</script>

<script>
(function(){
const B = window.BRAND;
const has = v => v !== undefined && v !== null && v !== "" &&
                 !(Array.isArray(v) && v.length === 0) &&
                 !(typeof v === "object" && !Array.isArray(v) && Object.keys(v).length === 0);
const get = p => p.split('.').reduce((o,k)=> (o||{})[k], B);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const L   = k => (B.logos||{})[k] || null;

/* ── color helpers ────────────────────────────────────── */
const rgbOf = h => { const m=String(h).replace('#','').match(/^([0-9a-f]{6})$/i);
  if(!m) return ''; const n=parseInt(m[1],16);
  return `R ${n>>16&255}  G ${n>>8&255}  B ${n&255}`; };
const lum = h => { const m=String(h).replace('#','').match(/^([0-9a-f]{6})$/i);
  if(!m) return 1; const n=parseInt(m[1],16);
  const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;
    return v<=.03928? v/12.92 : Math.pow((v+.055)/1.055,2.4);});
  return .2126*c[0]+.7152*c[1]+.0722*c[2]; };
const onCol = h => lum(h) > .45 ? '#17191B' : '#FFFFFF';

/* ── push client colors into the CSS custom properties ─── */
(function(){
  const c = B.colors||{}, n = B.neutrals||{}, r = document.documentElement.style;
  const set = (k,v) => { if(has(v)) r.setProperty(k, v); };
  set('--brand-1', (c.primary  ||{}).hex);
  set('--brand-2', (c.secondary||{}).hex || (c.primary||{}).hex);
  set('--brand-3', (c.tertiary ||{}).hex || (c.secondary||{}).hex || (c.primary||{}).hex);
  set('--ink',     (n.ink      ||{}).hex);
  set('--paper',   (n.paper    ||{}).hex ? '#FBFBF9' : null);
})();

/* ── shared partials ──────────────────────────────────── */
function slot(key, cls, label){
  const path = L(key);
  const tag  = label ? `<strong>${esc(label)}</strong>` : '';
  return `<div class="slot ${cls||''}" data-logo="${key}">
    <img alt="">
    <div class="ph">${tag}<em>${esc(path || 'assets/'+key+'.svg')}</em></div>
  </div>`;
}
function page(id, cls, runL, runR, folioTitle, body){
  return `<section class="page ${cls||''}" data-sec="${id}">
    <div class="frame"></div>
    <div class="inner">
      <div class="rh"><span>${esc(runL)}</span><span>${esc(runR)}</span></div>
      ${body}
      <div class="rf"><span>${esc(B.owner||'')}</span>
        <span class="folio" data-folio="${esc(folioTitle)}"></span></div>
    </div>
  </section>`;
}
function head(num, eyebrow, title, lede){
  return `<div class="head">
    <div class="eyebrow" data-eyebrow="${esc(eyebrow)}"></div>
    <h2 class="pagetitle">${esc(title)}</h2>
    ${lede ? `<p class="lede">${lede}</p>` : ''}
  </div><div class="rule"></div>`;
}
const runR = () => `${B.name||''} · Brand Guidelines`;

/* ═══════════════════════════════════════════════════════
   SECTION REGISTRY
   Each section declares the brand.json keys it needs.
   A section renders only when every `requires` key is present.
   ═══════════════════════════════════════════════════════ */
const SECTIONS = [

{ id:'cover', title:'Cover', requires:['name'],
  render(){
    const c = B.colors||{}, n = B.neutrals||{};
    const chips = [c.primary,c.secondary,c.tertiary,n.ink].filter(has)
      .map(x=>`<div class="cchip" style="background:${x.hex};color:${onCol(x.hex)}">${esc(x.hex.toUpperCase())}</div>`).join('');
    const meta = [B.version,B.year,B.domain].filter(has)
      .map(x=>`<span>${esc(x)}</span>`).join('');
    return page('cover','p-cover', B.descriptor||'Brand Guidelines',
      `Rev. ${B.version||''} · ${B.year||''}`, 'Cover', `
      <div class="cbody">
        <div>
          <div class="cdesc">${esc(B.descriptor||'Brand Guidelines')}</div>
          <div class="cname">${esc(B.name)}</div>
          ${chips ? `<div class="cchips">${chips}</div>` : ''}
          ${meta  ? `<div class="cmeta">${meta}</div>` : ''}
        </div>
        ${slot('primary','clogo','Primary logo')}
      </div>`);
  }},

{ id:'foundation', title:'Foundation',
  requires:['foundation.headline','foundation.body','foundation.pillars'],
  render(){
    const f = B.foundation;
    const hd = Array.isArray(f.headline) ? f.headline : [f.headline];
    const pil = f.pillars.map((p,i)=>`<div class="pillar">
        <div class="n">${String(i+1).padStart(2,'0')}</div>
        <h5>${esc(p.title)}</h5><p>${esc(p.body)}</p></div>`).join('');
    return page('foundation','', 'Foundation', runR(), 'Foundation', `
      <div class="head">
        <div class="eyebrow" data-eyebrow="Foundation"></div>
        <div class="fhead">${hd.map((l,i)=>i? `<span class="b">${esc(l)}</span>`:esc(l)).join('<br>')}</div>
        <p class="fbody">${f.body}</p>
      </div>
      <div class="pillars" style="grid-template-columns:repeat(${f.pillars.length},1fr)">${pil}</div>`);
  }},

{ id:'logo_primary', title:'Primary logo', requires:['logos.primary'],
  render(){
    const r = B.logoRules || {};
    return page('logo_primary','', 'Logo · Primary', runR(), 'Primary logo',
      head(null,'The primary logo','Primary logo',
        'This is the master mark. Reproduce it only from the master file — never redraw, re-space, or retype it. Everything that follows derives from this artwork.')
      .replace('<div class="rule"></div>','') + `
      ${slot('primary','hero-slot','Primary logo · master artwork')}
      <div class="two">
        <div>
          <div class="seclabel">Clear space</div>
          <div class="cs-box">
            <div class="cs-x" style="background:color-mix(in srgb,var(--brand-1) 22%,transparent)"></div>
            <div class="cs-xlabel">X = cap-height of the mark</div>
            ${slot('primary','', null).replace('class="slot ','class="slot cs-inner ').replace('<div class="slot','<div style="background:none" class="slot')}
          </div>
          <p class="caption" style="margin-top:.1in">${esc(r.clearSpace ||
            'Clear space on all four sides equals X, where X is the cap-height of the mark. Nothing enters this zone.')}</p>
        </div>
        <div>
          <div class="seclabel">Minimum size</div>
          <div class="min-row">
            ${slot('primary','min-slot',null)}
            <div class="min-bar"><div class="bar"></div>
              <div class="tag">${esc(r.minPrint||'10 mm')} / ${esc(r.minScreen||'40 px')}</div></div>
          </div>
          <p class="caption" style="margin-top:.1in">Never reproduce below
            <b>${esc(r.minPrint||'10 mm')}</b> wide in print or
            <b>${esc(r.minScreen||'40 px')}</b> on screen. Below that, step to the simplest available mark.</p>
        </div>
      </div>`);
  }},

{ id:'logo_variations', title:'Variations', requires:['logos.primary'],
  render(){
    const cells = [
      { lab:'01 · Full color · light ground', k:'primary', cls:'',
        cap:'The default. Use wherever the ground is paper or a pale tint.' },
      { lab:'02 · Reversed · dark ground', k:'reversed', cls:'on-ink',
        cap:'For ink and photographic grounds. Check contrast before placing.',
        fallback:'primary', fbCls:'on-ink' },
      { lab:'03 · One color · black', k:'monoBlack', cls:'',
        cap:'Single-ink print, engraving, and anything scanned.',
        fallback:'primary', fbCls:'mono-b' },
      { lab:'04 · One color · white', k:'monoWhite', cls:'on-ink',
        cap:'Knockout for dark packaging, apparel, and video.',
        fallback:'primary', fbCls:'on-ink mono-w' },
      { lab:'05 · Mark only', k:'mark', cls:'on-brand',
        cap:'Favicon, app icon, avatar, and any square or tiny space.' },
      { lab:'06 · Stacked lockup', k:'stacked', cls:'',
        cap:"For narrow columns and tall formats where the horizontal lockup won't fit." }
    ].map(c=>{
      const real = has(L(c.k));
      const useKey = real ? c.k : (c.fallback || c.k);
      const useCls = real ? c.cls : (c.fbCls || c.cls);
      const derived = !real && c.fallback;
      return `<div class="cell">
        <div class="clabel">${esc(c.lab)}${derived?'<span class="derived">Derived</span>':''}</div>
        ${slot(useKey, useCls, c.lab.split('· ').slice(1).join('· '))}
        <div class="ccap">${esc(c.cap)}${derived?' <b>Derived from the primary file — supply master art before print.</b>':''}</div>
      </div>`;
    }).join('');
    return page('logo_variations','', 'Logo · Variations', runR(), 'Variations',
      head(null,'Logo variations','Logo variations',
        'Pick by ground first, then by ink: light or dark background, then how many colors the process allows.') +
      `<div class="grid3">${cells}</div>`);
  }},

{ id:'logo_misuse', title:'Misuse', requires:['logos.primary'],
  render(){
    const cells = [
      ['mis-recolor',"Don't recolor",'Reproduce only in the approved colorways.'],
      ['mis-effect', "Don't add effects",'No shadows, glows, bevels, or gradients.'],
      ['mis-rotate', "Don't rotate or tilt",'Keep the mark level.'],
      ['mis-stretch',"Don't stretch or condense",'Scale proportionally only.'],
      ['mis-crowd',  "Don't box or crowd it",'Respect the clear space.'],
      ['mis-busy',   "Don't use on busy grounds",'It needs contrast and calm.'],
      ['mis-lowcon', "Don't set it on its own color",'Keep the mark legible.'],
      ['mis-retype', "Don't retype the name",'Use master art, never a typed substitute.']
    ].map(([cls,t,c])=>{
      const inner = cls === 'mis-retype'
        ? `<div class="slot"><div class="fake">${esc(B.name||'Brand Name')}</div></div>`
        : slot('primary','',null);
      return `<div class="cell mis ${cls}">
        <div class="clabel">${esc(t)}</div>${inner}
        <div class="ccap">${esc(c)}</div></div>`;
    }).join('');
    return page('logo_misuse','', 'Logo · Misuse', runR(), 'Misuse',
      head(null,'Logo misuse','Logo misuse',
        'The logo is fixed artwork. These are the eight ways it most often breaks. If in doubt, place the mark and leave it alone.') +
      `<div class="grid4">${cells}</div>`);
  }},

{ id:'color', title:'Color suite', requires:['colors.primary'],
  render(){
    const c = B.colors||{}, n = B.neutrals||{};
    const brand = ['primary','secondary','tertiary'].map(k=>c[k]).filter(has);
    const neut  = ['ink','paper'].map(k=>n[k]).filter(has);
    const sws = brand.map(x=>`<div class="sw">
        <div class="chip" style="background:${x.hex}"></div>
        <div class="meta"><div class="nm">${esc(x.name||'')}</div>
          <div class="hex">${esc(String(x.hex).toUpperCase())}</div>
          <div class="rgb">${rgbOf(x.hex)}</div>
          <div class="use">${esc(x.use||'')}</div></div></div>`).join('');
    const nsws = neut.map(x=>`<div class="nsw">
        <div class="chip" style="background:${x.hex};${lum(x.hex)>.9?'border-right:1px solid var(--rule)':''}"></div>
        <div class="meta"><div class="nm">${esc(x.name||'')}</div>
          <div class="hex">${esc(String(x.hex).toUpperCase())}</div></div></div>`).join('');
    const ratio = (B.colorRules||{}).ratio;
    return page('color','', 'Color', runR(), 'Color suite',
      head(null,'Color suite','Color suite',
        'Match these hex values on screen. Convert to CMYK from the hex for print and check on stock before a run.') + `
      <div class="swgrid" style="grid-template-columns:repeat(${Math.max(brand.length,1)},1fr)">${sws}</div>
      ${nsws?`<div class="nsws" style="grid-template-columns:repeat(${neut.length},1fr)">${nsws}</div>`:''}
      <div class="dodont">
        <div class="do"><h4>Do</h4><p class="caption">${esc(ratio ||
          'Let one color lead. Keep the primary for the logo and the single most important action on a page; use the lightest tone for large quiet areas.')}</p></div>
        <div class="dont"><h4>Don't</h4><p class="caption">Introduce colors outside this suite, tint or shade the brand colors to invent new ones, or set the primary as small body text on a light ground.</p></div>
      </div>`);
  }},

{ id:'typography', title:'Typography', requires:['typography.faces'],
  render(){
    const t = B.typography;
    const faces = t.faces.map(f=>`<div class="face">
        <div><div class="fname">${esc(f.name)}</div>
          <div class="frole">${esc(f.role||'')}</div></div>
        <div><div class="fsample" ${f.stack?`style="font-family:${f.stack}"`:''}>${esc(f.sample||B.name||'Aa')}</div>
          <div class="fnote">${esc(f.note||'')}</div></div></div>`).join('');
    const scale = (t.scale||[]).map(s=>`<tr>
        <td class="k">${esc(s.role)}</td><td>${esc(s.sample||'')}</td>
        <td class="spec">${esc(s.spec||'')}</td></tr>`).join('');
    return page('typography','', 'Typography', runR(), 'Typography',
      head(null,'Typography','Typography',
        `${t.faces.length} typeface${t.faces.length>1?'s':''}, each with one job. Never introduce another without updating this page.`) +
      `<div class="faces">${faces}</div>
       ${scale?`<table class="scale">${scale}</table>`:''}
       ${t.rules?`<div class="dodont">
         <div class="do"><h4>Do</h4><p class="caption">${esc(t.rules.do||'')}</p></div>
         <div class="dont"><h4>Don't</h4><p class="caption">${esc(t.rules.dont||'')}</p></div></div>`:''}`);
  }},

{ id:'iconography', title:'Iconography', requires:['icons'],
  render(){
    const icons = B.icons.map((ic,i)=>`<div class="icon">
        ${slot('icon'+i, ic.onDark?'on-ink':'', null).replace(`data-logo="icon${i}"`,`data-src="${esc(ic.file)}"`)}
        <div><h5>${esc(ic.name)}</h5>
          <div class="irole">${esc(ic.role||'')}</div>
          <p>${esc(ic.body||'')}</p>
          ${(ic.do||ic.dont)?`<div class="rules">
            <div class="do"><div class="k">Do</div><p>${esc(ic.do||'')}</p></div>
            <div class="dont"><div class="k">Don't</div><p>${esc(ic.dont||'')}</p></div></div>`:''}
        </div></div>`).join('');
    const few = B.icons.length <= 2;
    return page('iconography','', 'Iconography', runR(), 'Iconography',
      head(null,'Iconography','The icon set',
        'Each device has one job and a few firm rules. Used together and sparingly, they frame the name; used loudly, they cheapen it.') +
      `<div class="icons${few?' few':''}" style="grid-template-columns:repeat(${few?1:2},1fr)">${icons}</div>`);
  }},

{ id:'applications', title:'Applications', requires:['logos.primary'],
  render(){
    const a = B.applications || {};
    const nav = a.nav || ['How it works','Features','Pricing','Resources'];
    const feats = a.features || [];
    const rows = a.reportRows || [];
    const stats = a.reportStats || [];
    return page('applications','', 'Applications', runR(), 'Applications',
      head(null,'Applications','Site & reports',
        'Two surfaces carry the brand day to day: the website and the customer-facing document. They share one system — same lockup, same color roles, same spacing.') + `
      <div class="appgrid">
        <div class="app">
          <div class="seclabel">Website</div>
          <div class="browser">
            <div class="bchrome"><span class="bdot"></span><span class="bdot"></span><span class="bdot"></span>
              <span class="burl">${esc(B.domain||'yourdomain.com')}</span></div>
            <div class="bnav">${slot('primary','navlogo',null)}
              <ul>${nav.map(n=>`<li>${esc(n)}</li>`).join('')}</ul>
              <span class="cta">${esc(a.cta||'Get started')}</span></div>
            <div class="bhero">
              <h3>${a.heroHtml || esc(a.hero || B.name || '')}</h3>
              ${a.heroSub?`<p>${esc(a.heroSub)}</p>`:''}
              <div class="btns"><span class="b1">${esc(a.cta||'Get started')}</span>
                <span class="b2">${esc(a.ctaAlt||'Learn more')}</span></div>
            </div>
            ${feats.length?`<div class="bfeat">${feats.map((f,i)=>
              `<div><span class="fn">${String(i+1).padStart(2,'0')}</span>${esc(f)}</div>`).join('')}</div>`:''}
            <div class="bstrip"><div></div><div></div><div></div></div>
          </div>
          <p class="caption" style="margin-top:.09in">Primary logo in the header at full color. Primary color reserved for the single leading action; the supporting tones carry surfaces.</p>
        </div>
        <div class="app">
          <div class="seclabel">${esc(a.docLabel||'Report')}</div>
          <div class="report">
            <div class="rhead">${slot('primary','rlogo',null)}
              <div class="rmeta">${esc(a.docLabel||'Report')} · ${esc(B.year||'')}<br>Prepared for client</div></div>
            <div class="rbody">
              <div class="rtitle">${esc(a.docTitle||'Client report')}</div>
              <div class="rsub">${esc(a.docSub||'')}</div>
              ${stats.length?`<div class="rstats">${stats.map(s=>
                `<div><div class="k">${esc(s.k)}</div><div class="v">${esc(s.v)}</div></div>`).join('')}</div>`:''}
              ${rows.length?`<div class="rbars">${rows.slice(0,4).map((r,i)=>
                `<div class="row"><span class="lbl">${esc(r.k)}</span>
                 <span class="track"><span class="fill" style="width:${78-i*15}%"></span></span></div>`).join('')}</div>
                <table class="rtable">${rows.map(r=>
                `<tr><td>${esc(r.k)}</td><td>${esc(r.label||'')}</td><td>${esc(r.v||'')}</td></tr>`).join('')}</table>`:''}
            </div>
            <div class="rfoot"><span>${esc(B.domain||'')}</span><span>Page 01</span></div>
          </div>
          <p class="caption" style="margin-top:.09in">Logo top-left, a 2 pt primary-color rule under the header, data in the primary color against the lightest tone. Footer carries the domain on every page.</p>
        </div>
      </div>`);
  }},

{ id:'art_direction', title:'Art direction', requires:['artDirection.principles'],
  render(){
    const a = B.artDirection;
    const list = a.principles.map(p=>`<div><h5>${esc(p.title)}</h5><p>${esc(p.body)}</p></div>`).join('');
    const grounds = (a.grounds||[]).map(g=>`<div class="ground">
        <div class="sw-g" style="background:${esc(g.hex)};color:${onCol(g.hex)}"><span>${esc(g.name)}</span></div>
        <p>${esc(g.use||'')}</p></div>`).join('');
    return page('art_direction','', 'Art direction', runR(), 'Art direction',
      head(null,'Art direction','Art direction & photography', esc(a.intro||'')) + `
      <div class="ad">
        <div>${slot('reference','adref','Reference image')}
          <p class="caption" style="margin-top:.09in">${esc(a.referenceCaption||'Reference · art-direction target')}</p></div>
        <div class="adlist">${list}</div>
      </div>
      ${grounds?`<div class="seclabel" style="margin-top:.22in">Grounds</div>
        <div class="grounds" style="margin-top:0">${grounds}</div>`:''}`);
  }},

{ id:'voice', title:'Voice & tone', requires:['voice.attributes'],
  render(){
    const v = B.voice;
    const attrs = v.attributes.map(a=>`<div class="vattr">
        <h5>${esc(a.title)}</h5><p>${esc(a.body)}</p></div>`).join('');
    const ref = (v.reframe||[]).map(r=>`<div class="row">
        <span class="from">${esc(r.from)}</span><span class="arrow">→</span>
        <span class="to">${esc(r.to)}</span></div>`).join('');
    const say = (v.say||[]).map(s=>`<li>${esc(s)}</li>`).join('');
    const avoid = (v.avoid||[]).map(s=>`<li>${esc(s)}</li>`).join('');
    return page('voice','', 'Voice & tone', runR(), 'Voice & tone',
      head(null,'Voice & tone','Voice & tone', esc(v.intro||'')) + `
      <div class="vattrs" style="grid-template-columns:repeat(${v.attributes.length},1fr)">${attrs}</div>
      ${ref?`<div class="reframe"><div class="seclabel">Reframe</div>${ref}</div>`:''}
      ${(say||avoid)?`<div class="lex">
        <div class="say"><h4>We say</h4><ul>${say}</ul></div>
        <div class="avoid"><h4>We avoid</h4><ul>${avoid}</ul></div></div>`:''}`);
  }},

{ id:'legal', title:'Legal & usage', requires:['legal'],
  render(){
    const l = B.legal;
    const rows = (l.labelCopy||[]).map(r=>`<tr>
        <td>${esc(r.k)}</td><td>${esc(r.v)}</td></tr>`).join('');
    return page('legal','', 'Legal & usage', runR(), 'Legal & usage',
      head(null,'Legal & usage','Legal & usage',
        esc(l.intro||'The mark carries obligations. When compliance and design disagree, compliance wins.')) + `
      ${l.requiredCopy?`<div class="legalbox">
        <div class="k">${esc(l.requiredCopyLabel||'Required verbatim')}</div>
        <p>${esc(l.requiredCopy)}</p>
        <div class="note">${esc(l.requiredCopyNote||'Reproduce word for word · never abbreviate or restyle')}</div>
      </div>`:''}
      ${rows?`<div class="seclabel" style="margin-top:.22in">Required copy</div>
        <table class="ltable" style="margin-top:0">${rows}</table>`:''}
      <div class="lnotes">
        <div><h5>Trademark &amp; integrity</h5>
          ${l.trademark?`<p>${l.trademark}</p>`:''}
          <p><b>Integrity.</b> Reproduce only from master files. Never alter, recolor, redraw, or re-space the marks.</p></div>
        <div><h5>Permission</h5>
          <p>${esc(l.permission||'Third-party, retail, and co-marketing use requires written approval.')}</p>
          ${l.marketing?`<p>${esc(l.marketing)}</p>`:''}</div>
      </div>`);
  }}
];

/* ═══════════════════════════════════════════════════════
   BUILD
   ═══════════════════════════════════════════════════════ */
const enabled = SECTIONS.filter(s => s.requires.every(k => has(get(k))));
const gaps    = SECTIONS.filter(s => !enabled.includes(s))
                        .map(s => ({ id:s.id, title:s.title,
                                     missing:s.requires.filter(k=>!has(get(k))) }));
window.__GAPS__ = gaps;
window.__PAGES__ = enabled.map(s=>s.id);

document.getElementById('doc').innerHTML = enabled.map(s=>s.render()).join('');

/* folios + eyebrows numbered by final page order */
document.querySelectorAll('section.page').forEach((pg,i)=>{
  const num = String(i+1).padStart(2,'0');
  const f = pg.querySelector('[data-folio]');
  if(f) f.textContent = `${num} · ${f.dataset.folio}`;
  const e = pg.querySelector('[data-eyebrow]');
  if(e) e.textContent = `${num} · ${e.dataset.eyebrow}`;
});

/* logo slots: load real art, else keep the labelled drop-zone */
document.querySelectorAll('.slot').forEach(sl=>{
  const path = sl.dataset.src || L(sl.dataset.logo);
  const img  = sl.querySelector('img');
  if(!img) return;
  if(!path){ sl.classList.add('is-empty'); return; }
  sl.classList.add('is-empty');
  img.onload  = () => sl.classList.remove('is-empty');
  img.onerror = () => sl.classList.add('is-empty');
  img.src = path;
});

/* revision stamp on the cover */
document.title = `${B.name||'Brand'} — Brand Guidelines ${B.version||''}`.trim();
})();
</script>
</body>
</html>
